---
# BlitzArt Linux live ISO (dinit).
#
# Build:  ./build-iso      (wraps: buildiso -p blitzart -i dinit)
#
# The live system is a plain console: autologin on tty1 starts `blitzinstall`.
# rootfs = base layer, livefs = live-only tools (installer, partitioning, net).

live-session:
  user: blitzart
  password: blitz
  autologin: true
  use-xlibre: false
  services:
    - acpid
    - metalog
    - NetworkManager
    - dinit-user-spawn
  user-services: []

rootfs:
  packages:
    - mkinitcpio-nfs-utils
    - networkmanager
    - squashfs-tools
  packages-init:
    dinit:
      - metalog-dinit
      - networkmanager-dinit
    openrc: []
    runit: []
    s6: []

livefs:
  packages:
    - artix-grub-live
    - dinit-user-spawn
    - pipewire
    - pipewire-pulse
    - wireplumber
    - artools-base
    - artix-archlinux-support
    - archlinux-keyring
    - curl
    - dialog
    - gptfdisk
    - parted
    - git
    - rsync
    - terminus-font
    - wget
    - neovim
    # BlitzArt basic toolset (also installed on the target from the offline repo)
    - eza
    - ugrep
    - tree
    - fastfetch
    - starship
    - zsh
    - zsh-syntax-highlighting
    - zsh-autosuggestions
    - zsh-history-substring-search
    - fzf
    - bat
    - mcfly
    - zoxide
    - ttf-victor-mono-nerd
    - ttf-nerd-fonts-symbols
  packages-init:
    dinit:
      - artix-live-dinit
      - pipewire-dinit
      - pipewire-pulse-dinit
      - wireplumber-dinit
    openrc: []
    runit: []
    s6: []
