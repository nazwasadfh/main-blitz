  - dmraid
  - dosfstools
  - efibootmgr
  - e2fsprogs
  - exfat-utils
  - f2fs-tools
  - grub
  - artix-grub-theme
  - inetutils
  - iptables
  - jfsutils
  - linux
  - linux-firmware
  - linux-headers
  - lsb-release
  - logrotate
  - man-db
  - man-pages
  - memtest86+
  - mkinitcpio
  - modemmanager
  - nano
  - nbd
  - net-tools
  - ntfs-3g
  - os-prober
  - sudo
  - sysfsutils
  - texinfo
  - usbutils
  - ex-vi-compat
  - which
  - wireless-regdb
